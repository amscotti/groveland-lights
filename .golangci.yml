version: "2"

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - sqlclosecheck
    - gosec
    - exhaustive
    - cyclop
    - errorlint
    - noctx
    - forbidigo
  settings:
    cyclop:
      max-complexity: 15
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      forbid:
        - pattern: 'template\.HTML'
          message: 'template.HTML bypasses escaping; only the audited helper may use it (§8.4)'
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # The harness CLI intentionally executes git/make/opencode with arguments
      # derived from its own policy files and reads/writes paths inside the
      # repo. These gosec rules are app-code concerns there, not harness ones.
      - path: cmd/harness/
        linters:
          - gosec
      - path: cmd/harness/
        linters:
          - forbidigo
