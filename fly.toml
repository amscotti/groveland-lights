# Fly.io configuration (plan §5.3). Snapshot retention is set at volume
# creation time (§11 H4), not here.
app = "groveland-lights"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [http_service.checks]
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
