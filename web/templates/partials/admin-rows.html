<div id="rows"><!-- sync: pages/admin-list.html admin-rows-fragment -->
  {{if .Rows}}
  <table id="light-rows">
    <tbody>
    {{range .Rows}}<tr>
      <td class="light-thumb"><a href="{{.DetailURL}}"><img src="{{.ImgSrc}}" alt="{{.ImgAlt}}" width="48" height="48"></a></td>
      <td class="light-cell"><a href="{{.DetailURL}}">{{if .AssetNo}}<span class="light-asset">{{.AssetNo}}</span> {{end}}<strong class="light-label">{{.Label}}</strong></a> <span class="status status-{{.Status}}"><span class="dot" aria-hidden="true"></span>{{.Status}}</span></td>
    </tr>
    {{end}}</tbody>
  </table>
  {{else}}
  <p>No lights recorded yet — walk the town to add the first one.</p>
  {{end}}
  {{if or .HasNewer .HasOlder}}
  <div class="pager">
    {{if .HasNewer}}<form method="get" action="/admin/rows"><input type="hidden" name="page" value="{{.NewerPage}}"><button type="submit" hx-get="/admin/rows?page={{.NewerPage}}" hx-target="#rows" hx-swap="outerHTML">Newer</button></form>{{end}}
    {{if .HasOlder}}<form method="get" action="/admin/rows"><input type="hidden" name="page" value="{{.OlderPage}}"><button type="submit" hx-get="/admin/rows?page={{.OlderPage}}" hx-target="#rows" hx-swap="outerHTML">Older</button></form>{{end}}
  </div>
  {{end}}
</div>
