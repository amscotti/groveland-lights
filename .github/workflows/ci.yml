name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: npm ci
        run: npm ci

      - name: install browsers (before make ci, which runs the e2e targets)
        run: npx playwright install --with-deps chromium webkit

      - name: make ci
        run: make ci
        env:
          CI: "1"

      - name: upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - name: deploy
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then echo "FLY_API_TOKEN not set; skipping"; exit 0; fi
          flyctl deploy --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: smoke
        run: make smoke BASE_URL="${{ vars.SMOKE_URL || 'https://groveland-lights.fly.dev' }}"
